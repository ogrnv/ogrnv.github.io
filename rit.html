<!DOCTYPE html>
<script>
const
hm=8,	//size of a side of square table/board.
kcb=3,	//how many of one digit types of chips are placed on the table	
emb=22,	//number of empty sells 22=64-42
rnd=5,	//rounds number
stp=6;	//number of steps in a round 
p=0,	//1 - input in pairs and printing states of the board
u=false;//statistic test mode

</script>
<head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>
<title>Random Intelligence Test for AI</title>
<style>
html, body {
background-color: rgba(16, 16, 32, 1.0);
color:#FFFFFF;
font-size:16px;
width:  100%;
height: 100%;
}
a:link, a:visited {
  color: #0FF;
  text-align: center;
  text-decoration: none;
  display: inline-block;
}
.f16 {font-size: 16pt; color:  #0F0;}
.F16 {font-size: 16pt; color:  #0FF;}
</style> 
<body>
<table width=100% heigth=100%>
<tbody>
<tr>
<td width=15%>&nbsp;</td>
<td width=70%>
<p align=left class=f16>
<p align=left class=f16 id="MANUAL"></p>

<p align=left class=F16 id="CELLS"></p>
<div id="bs"></div>
<p align=left class=F16><span id="NEXT5"></span></p>
<p align=left class=F16 id="OUT"></p>
<p align=left class=f16>
</p>
<p align=left class=F16 id="INFO"></p>

<script>
let mn=0,	//moves number
qn=0;		//number of finished lines >4 chips long
let np=0, fc=false, alcl=1, i, j, ti=-1, tj=-1, tz, sha=0, rd=0,
xx="", xf="", xxx="", s="", inpr="",ise,jse,bn,
ina, jna, iko, jko, ox5=0, hmb, bc, csx="", tbx="",
n5 = [], Csa = [], Csb = [], TC = [],
	x0 = -1, x1 = -1, y0 = -1, y2 = -1; //0-start address 1-finish one
	
for (i = 0; i < hm; i++){
	Csb[i] = [];
	for (j = 0; j < hm; j++){
		Csb[i][j] = 0;
	}
}

for (i = 0; i < 5; i++){n5[i] = 0;}
document.getElementById("MANUAL").innerHTML = `Let’s play RIT:<br><a href="https://ogrnv.github.io/rit.html" target="_blank">Source https://ogrnv.github.io/rit.html</a><br><br>
There is only one player in the game - you, so you should take the first move!<br><br>
Let TB be given <b><span id="HMm"></span></b> board with chips or the board with chips after your move(s), TB[address] be an integer assigned to a cell with the address: zero mean an empty cell, non-zero mean a chip marked with the integer on the cell.<br><br>
Let EM be a relocation of a chip to a horizontally or vertically adjacent zero cell. As a result of this relocation, the values ​​of TB[from] and TB[to] should swap.<br><br>
Every game move must be either an EM or a sequence of several EMs. Let the move start address be SA and the move finish address be FA. Please note: FA must not be equal to SA. Let move number be MN.
<br><br>
The goal of the game is to complete it in the fewest number of moves. The game ends after <b><span id="RNDn"></span> round(s), each consisting of <span id="STEPS"></span> step(s)</b>.
A step ends when YOU by your last move, complete a formation of a straight horizontal or vertical or diagonal line of five or more chips with the same marking. Once the step is completed, the TB will have these updates:
 five successive chips are removed from the line (for cases with long or/and several line(s) it is done randomly), then five previously presented chips are randomly added to the empty cells of the board.
<br><br>In the buttons version:<br>
 to make a move, press a button representing a SA chip, then press a FA button with a zero mark. In case of a move error, the MN number  after "Moves" does not change.<br>
Please note that the markings on the chips/buttons change to some extent after each change in the "Moves" counter.<br>
Make moves until "The game is over" message appears.<br><p align=left class=F16> 
The board with chips is:<br>`;
	
let info=`Board size=<span id="HM"></span><br>
Empty cells number=<span id="EMB"></span><br>
Number of types of chips=<span id="KCB"></span><br>
Rounds number=<span id="RNDs"></span><br>
Steps in one round=<span id="STEPSS"></span><br></b><br><br>`;
function random(min, max) {
let mi = Math.ceil(min), ma = Math.floor(max);
return Math.floor(Math.random()*(ma-mi+1)+mi);
}
/*
function random(min, max) {//https://stackoverflow.com/a/65440696
    const range = max - min + 1
    const bytes_needed = Math.ceil(Math.log2(range) / 8)
    const cutoff = Math.floor((256 ** bytes_needed) / range) * range
    const bytes = new Uint8Array(bytes_needed)
    let value
    do {
        crypto.getRandomValues(bytes)
        value = bytes.reduce((acc, x, n) => acc + x * 256 ** n, 0)
    } while (value >= cutoff)
    return min + value % range
}
*/
function pom(p, o, m){Csb[p][o]=m; bm(p,o,m);}
function newdesk(){
let i, j;
for (i = 0; i < hm; i += 1){
	for (j = 0; j < hm; j += 1){
		Csb[i][j]=random(1, kcb);
	}
}
//empty emb cells
n=0;
while(n<emb){	
	i=random(0, hm - 1);
	j=random(0, hm - 1);
	if(Csb[i][j]>0){Csb[i][j] = 0; n++;}
}
n=0;
while(n<5){	
	n5[n]=random(1, kcb);
	n++;}
/*
*/
let s = ""; //for (i=0; i<hm; i++) s=s+Csb[i]+"<br>";
//document.getElementById("CELLS").innerHTML = s;
if(stp>1){s = "The next five chips: "; for (i=0; i<4; i++) s=s+n5[i]+","; s=s+n5[4]; document.getElementById("NEXT5").innerHTML = s;}
if(mn==0) {
	document.getElementById("OUT").innerHTML = "Moves 0<br>";
	document.getElementById("INFO").innerHTML = info;
	document.getElementById("HM").innerHTML = hm + "x" + hm;
	document.getElementById("HMm").innerHTML = hm + "x" + hm;
	document.getElementById("EMB").innerHTML = emb;
	document.getElementById("KCB").innerHTML = kcb;
	document.getElementById("STEPSS").innerHTML = stp;
	document.getElementById("RNDs").innerHTML = rnd;
	document.getElementById("STEPS").innerHTML = stp;
	document.getElementById("RNDn").innerHTML = rnd;

	}
}

let btn = document.getElementById("bs");
newdesk();
// Create buttons
const se = [];

	for (let i = 0; i < hm; i++) {
		for (let j = 0; j < hm; j++){
    const d = document.createElement('button');
    d.className = 'button';
    se.push(d);
    bm(i, j, Csb[i][j]);
    d.dataset.index = i*hm+j;
    btn.appendChild(d);     
  } let br = document.createElement("br");    
    btn.appendChild(br);
  }

function bm(ise, jse, bn){se[(ise*hm)+jse].textContent = bn;}
function FZ(x, y)
{
 if((x>0)&&(Csb[x-1][y]==0)&&(TC[x-1][y]==0))
   {
    TC[x-1][y]=1; FZ((x-1),y);
   }
 if((x<hm-1)&&(Csb[x+1][y]==0)&&(TC[x+1][y]==0))
   {
    TC[x+1][y]=1; FZ((x+1),y);
   }
 if((y>0)&&(Csb[x][y-1]==0)&&(TC[x][y-1]==0))
   {
    TC[x][y-1]=1; FZ(x,(y-1));
   }
 if((y<hm-1)&&(Csb[x][y+1]==0)&&(TC[x][y+1]==0))
   {
    TC[x][y+1]=1; FZ(x,(y+1));
   }
}
function ver(colr, i, j){
ina=i; jna=j;
while((ina-1) >= 0){
ina--;
if(colr != Csb[ina][j]){ina++; break;}	
}
iko=i;
while((iko+1) < hm){
iko++;
if(colr != Csb[iko][j]){iko--; break;}	
}
hmb=iko-ina+1;
if (hmb>4) {ox5=1;}
}
//-----------------------------------------
function hor(colr, i, j){
jna=j; ina=i;
while((jna-1) >= 0){
jna--;
if(colr != Csb[i][jna]){jna++; break;}	
}
jko=j;
while((jko+1) < hm){
jko++;
if(colr != Csb[i][jko]){jko--; break;}	
}
hmb=jko-jna+1;
if (hmb>4) {ox5=1;}
}
//-----------------------------------------
function nak(colr, i, j){
ina=i; jna=j;
while((ina-1) >= 0 && (jna-1) >= 0){
ina--; jna--;
if(colr != Csb[ina][jna]){ina++; jna++; break;}	
}
iko=i; jko=j;
while((iko+1) < hm && (jko+1) < hm){
iko++; jko++;
if(colr != Csb[iko][jko]){iko--; jko--; break;}	
}
hmb=jko-jna+1;
if (hmb>4) {ox5=1;}
}
//-----------------------------------------
function nkl(colr, i, j){
ina=i; jna=j;
while((ina+1) < hm && (jna-1) >= 0){
ina++; jna--;
if(colr != Csb[ina][jna]){ina--; jna++; break;}	
}
iko=i; jko=j;
while((iko-1) >= 0 && (jko+1) < hm){
iko--; jko++;
if(colr != Csb[iko][jko]){iko++; jko--; break;}	
}
hmb=ina-iko+1;
if (hmb>4) {ox5=1;}
}
function ValuX(colr, i, j)
{
	ox5=0;
let b, e, n, an = new Int32Array(1);
let tt = [];// таблица типов

// выбираем случайно тип {0,1..3} и проверяем его на линию > 4 фишек
for (e = 0; e < 4; e++) tt[e] = -1; //номер строки = типу, значение > 0 номер по порядку
 e=0;
//найти порядок 4х типов 
while (e<4){ // найти следующий тип - | / \  для исследования на >4
	window.crypto.getRandomValues(an); n=0;	
	while(n<16){
	b = 3 & an[0]; //выделяем 2 бита справа
	if (tt[b]  == -1) {tt[b]  = e;
	e++; if (e==4) break;}
	an[0] = an[0] >>> 2; // сдвигаем на 2 бита вправо
	n++; 
	}
}
//пытаемся найти линию в порядке определенном в tt
for (e=0; e<4; e++){ // e - номер порядка
b=1;
n=0;
while(n<4){ //ищем номер порядка e
	if(tt[n]==e) {//n - номер типа - | / \ 
	//для определенного типа n ищем 5 в ряд 
	switch (n) {
  	case 0: ver(colr, i, j); break;
	case 1: hor(colr, i, j); break;
	case 2: nak(colr, i, j); break;
	case 3: nkl(colr, i, j); break; 
	default:
	}
	}
	if(ox5>0) {
	if(hmb>4){// сколько вариантов удаления от точки с мин знач. х
		if(hmb==5){bc=0;}
		else{
		bc=random(0, hmb - 5); //смещение от точки с мин знач. х
		}
	// delete 5 then add 5
	// убираем фишки
	for(b=0; b<5; b++){
	// обнулить 5 cells
	if(n==0)pom(ina+bc+b, jna, 0);
	if(n==1)pom(ina,jna+bc+b,0);
	if(n==2)pom(ina+bc+b,jna+bc+b,0);
	if(n==3)pom(ina-bc-b,jna+bc+b,0);
	}
var hmze=0, fri = [-1,-1,-1,-1,-1], frj = [-1,-1,-1,-1,-1];
for (i = 0; i < hm; i += 1){
	for (j = 0; j < hm; j += 1){
		if(Csb[i][j] == 0) { fri[hmze]=i; frj[hmze]=j; hmze++;}
	}
}
// добавить пять фишек
if(qn<stp-1){
for (i = 0; i < 5; i++){
		bc=random(0, hmze - 1); //какую именно взять
		var ic, jc;
		ic=fri[bc]; jc=frj[bc];
		pom(ic,jc,n5[i]);
//изменить таблицу св.клеток last--> на место bc и hmze--
		fri[bc]=fri[hmze-1]; frj[bc]=frj[hmze-1]; hmze = hmze - 1;
}
}
		} //if(hmb>4
		n=4; // найдено > 4
	}
	else n++;
}
if(ox5==1) e=4;
}
}//ValuX end
function subs(strx, find, replace){
	var escapedFind=find.replace(/([.*+?^=!:${}()|\[\]\/\\])/g, "\\$1");
    return strx.replace(new RegExp(escapedFind, 'g'), replace);
}
function mbo(i, j){
if(alcl==1){ //	allow to process next click
  alcl=0; //disallow clics immediately	
	if(Csb[i][j]==0){if(fc==false){alcl=1; return;}} //fc - first click
	else{ti=i;tj=j;tz=Csb[i][j];fc=true; alcl=1; return;}
	
  for(x=0; x<hm; x++){TC[x] = []; for(y=0; y<hm; y++) TC[x][y] = 0;}

  FZ(ti,tj); //where from
  if(TC[i][j]!=0){
	fc = false;
	pom(i,j,Csb[ti][tj]);
	pom(ti,tj,0);
	ValuX(Csb[i][j], i, j);
mn++; if(mn==1){document.getElementById("MANUAL").innerHTML = "";document.getElementById("INFO").innerHTML = "";}
if(ox5>0)
{
	qn++;
	if(qn<stp) {
		n=0;
		while(n<5){n5[n]=random(1, kcb);n++;}
		s = "The next five chips: "; for (i=0; i<4; i++) s=s+n5[i]+",";
		s=s+n5[4];
		if(qn==(stp - 1)) s="";
		 document.getElementById("NEXT5").innerHTML = s;
	}
	else {
		if(rd+1 == rnd){ u=false;
		xf="<b>The game is over. Many thanks!<br>Moves per step: " + mn/(stp*rnd) + "</b> <br>";
	document.getElementById("INFO").innerHTML = info;		
	document.getElementById("HM").innerHTML = hm + "x" + hm;
	document.getElementById("EMB").innerHTML = emb;
	document.getElementById("KCB").innerHTML = kcb;
	document.getElementById("STEPSS").innerHTML = stp;
	document.getElementById("RNDs").innerHTML = rnd;	
		alcl=0;}
		else{
			rd++; qn=0; newdesk();
			for (let i = 0; i < hm; i++) {
			for (let j = 0; j < hm; j++){
			bm(i, j, Csb[i][j]);
			}}			
		}
	}
}
if(xf=="") {xx="Finished " +qn+ " step(s) in round " + (rd+1) +"<br>Moves " + mn + "<br>";
if(p==1) {	
	xx = xx + "Verified board:<br>";
	for (i=0; i<hm; i++) xx=xx+Csb[i]+"<br>";
}
}
else xx = xf+ "Moves " + mn + ", total steps " +(stp*rnd)+ "<br>";
document.getElementById("OUT").innerHTML = xx;
if(xf!="") {btn.removeEventListener('click',arguments.callee,false); exit;}
}
alcl=1;
}//if(alcl==1)
}
  btn.addEventListener('click', e => {
    const target = e.target;
    if (target.matches('button.button')) {
      const w = target.dataset.index;
		  j=w%hm; i=(w - j)/hm; //alert(i + ' ' + j);
		  if(p) { //input in pairs
			np++; //number in pair
			if(np==3) np=1;
			if(np==1) {alcl=1; fc=0;} //first click
		  }
		  mbo(i, j);
	  }      
  });
while(u){
	i=random(0, hm - 1);
	j=random(0, hm - 1);
mbo(i, j);	
}
</script>
